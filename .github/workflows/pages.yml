name: Deploy add-in to GitHub Pages

# Publish the add-in to GitHub Pages on every push to main/master.
# The site URL becomes: https://<your-username>.github.io/<repo-name>/
# The manifest at <site>/manifest.xml can then be installed by anyone
# (Word → Insert → Add-ins → My Add-ins → Upload My Add-in).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with public URL baked in
        run: npm run build
        env:
          BUILD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
