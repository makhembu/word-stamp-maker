name: Deploy add-in to GitHub Pages

# Publish the add-in to GitHub Pages on every push to main/master.
# The site URL becomes: https://<your-username>.github.io/<repo-name>/
# The manifest at <site>/manifest.xml can then be installed by anyone
# (Word → Insert → Add-ins → My Add-ins → Upload My Add-in).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # publishing the installer zip as a release asset (powers the download badge)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with public URL baked in
        run: npm run build
        env:
          BUILD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Empty until set (repo variable GA_MEASUREMENT_ID); builds with zero tracking
          # until then. The measurement id is public (it ships in the page source), so a
          # repo variable, not a secret, is the right place for it.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Build one-click installer + download zip
        # Generates setup/install-windows.bat, setup/install-mac.command, README
        # with the live URL baked in, then ships it all as stamp-maker-setup.zip
        # so users download a zip (no raw XML handling).
        run: |
          node scripts/make-installer.mjs
          cd dist
          chmod +x setup/install-mac.command
          zip -r stamp-maker-setup.zip setup

      - name: Publish installer zip as a release asset
        # One rolling release (tag installer-latest) holds the zip. Its public
        # download_count feeds the live badge on the landing page via the GitHub
        # API (no auth, CORS-enabled), so the badge shows REAL downloads.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: Latest installer
          body: |
            One-click installer for **Stamp Maker**, the Microsoft Word add-in.
            This release is updated automatically on every deploy; the download
            count powers the badge on the landing page.
          files: dist/stamp-maker-setup.zip
          fail_on_unmatched_files: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
